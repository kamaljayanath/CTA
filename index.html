<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Landing Page</title>

    <!-- ChannelBoost Tracking Script -->
    <script>
    (function (w, d, s, u) {
        let j = d.createElement(s);
        j.async = true;
        j.src = "https://assets.channelboost.com/scripts/embeddingwidget.js?uid=" + u;

        let f = d.getElementsByTagName(s)[0];
        f.parentNode.insertBefore(j, f);

    })(window, document, "script", "a733e81d-99c2-4195-8e2b-631d0159e860");
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            text-align: center;
        }

        button {
            display: block;
            width: 220px;
            padding: 15px;
            margin: 12px auto;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007BFF;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .video-container {
            margin-top: 30px;
            display: none;
        }

        iframe {
            width: 90%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Welcome</h2>

    <!-- Sign Up -->
    <button onclick="playVideo(
        'sign_up_button',
        'https://www.youtube.com/embed/dQw4w9WgXcQ'
    )">
        Sign Up
    </button>

    <!-- Login -->
    <button onclick="playVideo(
        'login_button',
        'https://www.youtube.com/embed/3JZ_D3ELwOQ'
    )">
        Login
    </button>

    <!-- Book a Demo -->
    <button onclick="playVideo(
        'demo_button',
        'https://www.youtube.com/embed/LXb3EKWsInQ'
    )">
        Book a Demo
    </button>

    <!-- Video Player -->
    <div class="video-container" id="videoContainer">
        <iframe
            id="youtubePlayer"
            src=""
            allowfullscreen
            allow="autoplay">
        </iframe>
    </div>

</div>

<script>

/**
 * Play YouTube video when button clicked
 */
function playVideo(eventName, videoUrl) {

    // Track event
    if (typeof trackify !== "undefined") {
        trackify.trackEvent(eventName);
        console.log("Tracked:", eventName);
    } else {
        console.warn("trackify not loaded");
    }

    // Show video container
    const container = document.getElementById("videoContainer");
    const player = document.getElementById("youtubePlayer");

    // Autoplay enabled
    player.src = videoUrl + "?autoplay=1";

    container.style.display = "block";
}


/**
 * Track referral lead submissions
 */
function trackReferralLead(formData) {

    if (typeof trackify !== "undefined") {

        trackify.trackLead({
            email: formData.email,
            firstName: formData.firstName || "",
            lastName: formData.lastName || "",
            companyName: formData.companyName || ""
        });

        console.log("Referral lead tracked");

    } else {
        console.warn("trackify not loaded");
    }
}

</script>

</body>
</html>
